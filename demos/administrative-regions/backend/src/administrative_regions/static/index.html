<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>行政区划服务</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; background: #f5f5f0; color: #22251f; }
      body { max-width: 760px; margin: 8vh auto; padding: 0 20px; }
      main { background: white; border: 1px solid #dedfd8; border-radius: 12px; padding: 28px; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      input { flex: 1 1 300px; min-height: 42px; padding: 0 12px; border: 1px solid #b9bcb2; border-radius: 6px; }
      button { min-height: 42px; padding: 0 16px; border: 0; border-radius: 6px; background: #245c46; color: white; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { white-space: pre-wrap; margin-top: 20px; padding: 14px; border-radius: 6px; background: #f1f2ed; }
      small { color: #5a6058; }
    </style>
  </head>
  <body>
    <main>
      <h1>行政区划服务</h1>
      <p>读取本机缓存并从民政部公开数据源同步。地区树读取接口为只读公开接口。</p>
      <div class="row">
        <input id="token" type="password" autocomplete="off" placeholder="管理令牌（只保存在当前页面内存）" aria-label="管理令牌" />
        <button id="refresh">刷新状态</button>
        <button id="sync">立即同步</button>
      </div>
      <pre id="status" role="status" aria-live="polite">正在读取状态…</pre>
      <small>定时同步：每周一 03:00（服务端配置时区）。MCP 地址：<code>/mcp</code></small>
    </main>
    <script>
      const tokenInput = document.querySelector('#token')
      const statusView = document.querySelector('#status')
      const syncButton = document.querySelector('#sync')
      async function refresh() {
        const response = await fetch('/api/status', { headers: { Authorization: `Bearer ${tokenInput.value}` } })
        statusView.textContent = JSON.stringify(response.ok ? await response.json() : { error: `HTTP ${response.status}` }, null, 2)
      }
      document.querySelector('#refresh').addEventListener('click', refresh)
      syncButton.addEventListener('click', async () => {
        syncButton.disabled = true
        statusView.textContent = '正在同步…'
        try {
          const response = await fetch('/api/sync', { method: 'POST', headers: { Authorization: `Bearer ${tokenInput.value}` } })
          const body = await response.json()
          statusView.textContent = JSON.stringify(response.ok ? body : { error: body.detail }, null, 2)
        } catch (error) {
          statusView.textContent = String(error)
        } finally {
          syncButton.disabled = false
        }
      })
      refresh().catch((error) => { statusView.textContent = String(error) })
    </script>
  </body>
</html>
