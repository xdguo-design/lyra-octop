<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="multi-agent-orchestrator">
  <defs>
    <linearGradient id="bg-multi-agent-orchestrator" x1="20" y1="8" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="32" fill="url(#bg-multi-agent-orchestrator)"/>
  <!-- shoulders -->
  <path d="M26 118 Q28 94 48 88 Q64 84 80 88 Q100 94 102 118 Z" fill="#7C3AED"/>
  <path d="M48 88 Q64 96 80 88 L78 118 H50 Z" fill="#6D28D9" opacity="0.28"/>
  <!-- hair back: full bob volume, sides down to jaw -->
  <path d="M34 70 Q26 30 64 20 Q102 30 94 70 Q92 42 64 38 Q36 42 34 70 Z" fill="#4C1D95"/>
  <!-- neck -->
  <rect x="56" y="84" width="16" height="14" rx="6" fill="#E8C4A0"/>
