  <g transform="translate(97,97)">
    <circle r="13" fill="#FFFFFF"/>
    <circle r="13" fill="none" stroke="#DDD6FE" stroke-width="1.5"/>
    <g stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round">
      <path d="M0 0 V-7.6"/>
      <path d="M0 0 L-6.6 3.8"/>
      <path d="M0 0 L6.6 3.8"/>
    </g>
    <circle r="3.6" fill="#7C3AED"/>
    <circle cx="0" cy="-7.6" r="2.6" fill="#6D28D9"/>
    <circle cx="-6.6" cy="3.8" r="2.6" fill="#6D28D9"/>
    <circle cx="6.6" cy="3.8" r="2.6" fill="#6D28D9"/>
  </g>
</svg>
