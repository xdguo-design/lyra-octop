  <ellipse cx="91" cy="67" rx="4.5" ry="6.5" fill="#E8C4A0"/>
  <!-- head -->
  <ellipse cx="64" cy="64" rx="27" ry="29" fill="#E8C4A0"/>
  <!-- bangs: side-swept fringe filling the forehead -->
  <path d="M37 60 Q34 36 64 31 Q94 36 91 60 Q86 44 68 41 Q50 39 43 51 Q39 55 37 60 Z" fill="#4C1D95"/>
  <!-- strand sweep hint -->
  <path d="M60 33 Q74 35 82 44" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- face -->
  <ellipse cx="52" cy="62" rx="3.2" ry="3.8" fill="#2E1065"/>
  <ellipse cx="76" cy="62" rx="3.2" ry="3.8" fill="#2E1065"/>
  <circle cx="53.2" cy="60.8" r="1.1" fill="#fff" opacity="0.95"/>
  <circle cx="77.2" cy="60.8" r="1.1" fill="#fff" opacity="0.95"/>
  <path d="M46 54 Q52 51 58 54" fill="none" stroke="#2E1065" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M70 54 Q76 51 82 54" fill="none" stroke="#2E1065" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M64 64 Q66 70 62 72" fill="none" stroke="#C08457" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M52 74 Q64 82 76 74" fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="44" cy="72" r="4" fill="#F9A8D4" opacity="0.32"/>
  <circle cx="84" cy="72" r="4" fill="#F9A8D4" opacity="0.32"/>
