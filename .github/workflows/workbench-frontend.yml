name: LYRA workbench frontend checks

on:
  push:
    branches: [dev]
    paths:
      - 'dashboard/**'
      - '.github/workflows/workbench-frontend.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/workbench-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard
      - name: Type-check and build
        run: npm run build
        working-directory: dashboard
      - name: Test workbench routing and security boundaries
        run: npm run test -- src/pages/Home src/components/TodoProgressPanel.test.tsx src/components/ThemeGallery.test.tsx src/components/AvatarDropdown.displayName.test.tsx src/styles/appearanceStorage.test.ts src/styles/bootTheme.test.ts src/styles/visualSkins.test.ts
        working-directory: dashboard
